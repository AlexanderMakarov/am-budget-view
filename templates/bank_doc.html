<!DOCTYPE html>
<html lang="{{.Locale}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .bank-doc-content {
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 24px 32px;
            max-width: 900px;
            line-height: 1.6;
        }
        .bank-doc-content h1 { margin-top: 0; }
        .bank-doc-content img { max-width: 100%; cursor: pointer; }
        .bank-doc-content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        .bank-doc-content th, .bank-doc-content td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        .bank-doc-content th { background: #f5f5f5; }
        .bank-doc-content code { background: #f0f0f0; padding: 2px 4px; border-radius: 3px; }
        .bank-doc-content pre {
            background: #f5f5f5;
            padding: 12px;
            overflow-x: auto;
            border-radius: 4px;
        }
        .bank-doc-content a { color: #0066cc; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{.Title}}</h1>
            <div class="header-right">
                <button onclick="window.location.href='/files'" class="back-button">
                    {{localize "Files"}}
                </button>
                <button onclick="window.location.href='/'" class="back-button">
                    {{localize "Back to Dashboard"}}
                </button>
            </div>
        </header>

        <div class="bank-doc-content">
            {{.Content}}
        </div>
    </div>
    <script>
        document.querySelectorAll('.bank-doc-content img').forEach(function(img) {
            img.addEventListener('click', function() {
                window.open(this.src);
            });
        });
    </script>
</body>
</html>
